<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Natural Law Editions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+French+Canon+SC&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: contents rail | reading column (~66ch) | source panel; on phones the rail and panel become sheets. */
:root{
  --bg:#f5f6f3; --paper:#fbfbf9; --fg:#1d211f; --mut:#5e6662; --line:#d9ddd6; --soft:#eceee9;
  --accent:#27507c; --accent-soft:#e3eaf2; --add:#e3efe1; --add-line:#5f8f55; --del:#f4e3df;
  --fW:#b5462f; --fG:#2f6b4f; --fP:#2c4f86; --fBb:#8a5a00; --fBu:#7a3e8f; --fM:#0f7480; --fWi:#8a3a5a; --fBy:#5a6b12; --fF:#7a7a74; --fL:#4a4ab0;
  --display:"IM Fell French Canon SC", "Iowan Old Style", Georgia, serif;
  --text:"Source Serif 4", "Iowan Old Style", Georgia, serif;
  --ui:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121514; --paper:#181c1a; --fg:#e2e5e1; --mut:#9aa39e; --line:#2c322f; --soft:#202522;
  --accent:#8fb3dc; --accent-soft:#1e2a37; --add:#1d2b1d; --add-line:#8cc580; --del:#352321;
  --fW:#f08a72; --fG:#7cc4a0; --fP:#8fb0ea; --fBb:#e3b65a; --fBu:#c69ad2; --fM:#6fcbd6; --fWi:#e591b4; --fBy:#bccf5f; --fF:#a9aaa4; --fL:#a8a8f2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121514; --paper:#181c1a; --fg:#e2e5e1; --mut:#9aa39e; --line:#2c322f; --soft:#202522;
  --accent:#8fb3dc; --accent-soft:#1e2a37; --add:#1d2b1d; --add-line:#8cc580; --del:#352321;
  --fW:#f08a72; --fG:#7cc4a0; --fP:#8fb0ea; --fBb:#e3b65a; --fBu:#c69ad2; --fM:#6fcbd6; --fWi:#e591b4; --fBy:#bccf5f; --fF:#a9aaa4; --fL:#a8a8f2; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--text)}
a{color:var(--accent)}
button,input,select{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:var(--wr,260px) 6px minmax(0,1fr) 6px var(--wp,400px);grid-template-rows:auto minmax(0,1fr);height:100%}
.gut{cursor:col-resize;background:var(--bg);position:relative;touch-action:none}
.gut::after{content:"";position:absolute;inset:0 2px;border-radius:2px}
.gut:hover::after,.gut.drag::after{background:var(--accent-soft)}
body.resizing{user-select:none;cursor:col-resize}
.filt{display:contents}
/* top bar */
.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--paper);font:14px var(--ui);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{font:20px/1 var(--display);letter-spacing:.02em;margin-right:6px;white-space:nowrap}
.bar input[type=search]{width:min(260px,100%);padding:5px 9px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.tg{display:flex;align-items:center;gap:5px;color:var(--mut);white-space:nowrap;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:1px 8px 1px 6px;font:12.5px var(--ui);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--c)}
.chip[aria-pressed=false]{opacity:.45}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:3px 9px;cursor:pointer;font:13px var(--ui)}
.btn:hover{border-color:var(--accent)}
.only-narrow,.only-phone{display:none}
/* rail */
.rail{overflow:auto;border-right:1px solid var(--line);padding-block:12px;padding-inline:14px;font:13.5px/1.4 var(--ui);background:var(--paper)}
.rail h3{font:15px var(--display);margin:14px 0 4px;letter-spacing:.03em}
.rail a{display:flex;gap:6px;text-decoration:none;color:var(--fg);padding:3px 4px;border-radius:3px}
.rail a .n{color:var(--mut);min-width:2.6em;font-variant-numeric:tabular-nums}
.rail a.on{background:var(--accent-soft)}
.rail .meter{margin-left:auto;align-self:center;width:34px;height:4px;background:var(--soft);border-radius:2px;flex:none}
.rail .meter b{display:block;height:100%;background:var(--accent);border-radius:2px}
/* reading column */
.read{overflow:auto;padding-block:20px 80px;padding-inline:24px}
.page{max-width:68ch;margin:0 auto}
.chead{font:13px var(--ui);color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.ctitle{font:28px/1.25 var(--display);margin:4px 0 22px;text-wrap:balance}
.sec{margin:0 0 26px;scroll-margin-top:70px}
.sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;font:13px var(--ui);color:var(--mut);margin-bottom:4px}
.sh .no{font:600 15px var(--ui);color:var(--fg)}
.sh .unn{font:11.5px var(--ui);color:var(--mut);border:1px dashed var(--line);border-radius:3px;padding:0 5px}
.sh .marg{font-style:italic;font-family:var(--text);font-size:14.5px;color:var(--mut);flex-basis:100%}
.sh .dots{display:inline-flex;gap:3px;cursor:pointer;border:0;background:none;padding:0}
.sh .dots span{font:600 11px var(--ui);color:var(--paper);background:var(--c);border-radius:8px;padding:0 5px}
.sh .tools{margin-left:auto;display:flex;gap:6px}
.sh .tools button{border:0;background:none;color:var(--mut);cursor:pointer;font:12.5px var(--ui);padding:0}
.sh .tools button:hover{color:var(--accent)}
.sec.sel .tx{background:var(--paper);box-shadow:0 0 0 8px var(--paper)}
.tx{text-align:justify;hyphens:auto}
.tx .para{display:block;height:.3em}
.tx .para::after{content:"";display:inline-block;width:1.6em;height:1px}
.u{text-decoration:underline;text-decoration-color:var(--c,var(--accent));text-decoration-thickness:2px;text-underline-offset:3px;cursor:pointer}
.u.multi{text-decoration-style:double}
.u.poss{text-decoration-style:dashed;text-decoration-thickness:1.5px}
.u.off{text-decoration:none;cursor:auto}
.u.hit{background:var(--accent-soft)}
.chg .v73{background:var(--add);box-shadow:inset 2px 0 var(--add-line);padding:0 2px}
.d58{display:none}
.chg .d58{display:inline;text-decoration:line-through;text-decoration-color:#b0412e;background:var(--del);color:var(--mut);padding:0 2px}
.chg .d58::before{content:var(--old-tag,"");font:10px var(--ui);text-decoration:none;display:inline-block;margin-right:2px;color:#b0412e}
.pb{font:11px var(--ui);color:var(--mut);border:1px solid var(--line);border-radius:3px;padding:0 3px;margin:0 3px;vertical-align:1px;white-space:nowrap;cursor:pointer}
.xr{text-decoration:none;border-bottom:1px dotted var(--accent)}
.notes{margin-top:8px;padding-top:6px;border-top:1px solid var(--line);font-size:14px;line-height:1.55;color:var(--fg)}
.note{margin:4px 0}.note .mk{font:12px var(--ui);color:var(--mut);margin-right:4px}
.chg .note.added{background:var(--add);box-shadow:inset 3px 0 var(--add-line);padding:2px 8px}
.chg .note.added .v73{background:none;box-shadow:none}
.foot{font:12.5px var(--ui);color:var(--mut);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px}
.foot a{text-decoration:none}
.del{background:var(--del);padding:4px 8px;font-size:14px;margin-top:6px}
.dvs{margin-top:8px;border-top:1px dotted var(--line);padding-top:4px}
.dv{font:13px/1.5 var(--ui);color:var(--fg);margin:3px 0}
.dv summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;color:var(--mut)}
.dv summary::-webkit-details-marker{display:none}
.dv summary .wm{font:600 11px var(--ui);color:var(--paper);background:var(--fW);border-radius:8px;padding:0 6px;white-space:nowrap}
.dv.partly summary .wm{background:none;color:var(--fW);box-shadow:inset 0 0 0 1px var(--fW)}
.dv summary .q{font-style:italic}
.dv summary:hover .q{color:var(--accent)}
.dv[open] summary .q{color:var(--fg)}
.dvb{margin:4px 0 6px 0;padding-left:10px;border-left:2px solid var(--fW);font-size:13.5px}
.dvb .q{margin:3px 0;padding-left:8px;border-left:2px solid var(--line);font-size:12.5px;color:var(--mut)}
.dvb .q small{display:block;font:10.5px var(--ui);text-transform:uppercase;letter-spacing:.3px}
.dvb .q.la{font-family:var(--text);font-style:italic;font-size:13px}
.dvb .q.fr{font-family:var(--text);font-size:13px}
.dvb .lk{font:12px var(--ui);color:var(--mut);margin-top:3px}
.sh .dvc{font:600 11px var(--ui);color:var(--fW);border:1px solid var(--fW);border-radius:8px;padding:0 6px;cursor:pointer;background:none}
.nodiv .dvs,.nodiv .dvc{display:none}
/* panel */
.panel{overflow:auto;border-left:1px solid var(--line);background:var(--paper);padding-block:14px 40px;padding-inline:16px;font:14px/1.5 var(--ui)}
.panel h2{font:20px var(--display);margin:0 0 4px}
.panel .sub{color:var(--mut);font-size:13px;margin-bottom:10px}
.m{border-top:1px solid var(--line);padding:10px 0}
.m.hl{background:var(--accent-soft);margin-inline:-16px;padding-inline:16px}
.mh{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px}
.fam{font:600 11px var(--ui);color:var(--paper);background:var(--c);border-radius:8px;padding:0 6px}
.lab{border:1px solid var(--line);border-radius:3px;padding:0 5px;font-size:12px}
.q{font:15px/1.5 var(--text);margin:6px 0 0;padding-left:10px;border-left:3px solid var(--c)}
.q.src{border-left-color:var(--line);color:var(--fg)}
.q small{display:block;font:11px var(--ui);color:var(--mut);letter-spacing:.05em;text-transform:uppercase}
.ew{margin-top:8px;padding:6px 8px;background:var(--soft);border-radius:4px;font-size:13px}
.why{color:var(--mut);font-size:12.5px;margin-top:6px}
.lk{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;font-size:12.5px}
.empty{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font:13px var(--ui);padding:6px 12px;border-radius:4px;z-index:20}
.res a{display:block;padding:6px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--fg)}
.res a b{color:var(--accent);font-family:var(--ui);font-size:13px;margin-right:6px}
.res mark{background:var(--accent-soft);color:inherit}
.res a.on{background:var(--accent-soft);margin-inline:-16px;padding-inline:16px}
.enpop{position:fixed;z-index:30;font:600 12px var(--ui);background:var(--fg);color:var(--bg);border:0;border-radius:12px;padding:3px 10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.enpop[hidden]{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:4px 0 10px}
.seg button{border:0;background:var(--bg);color:var(--fg);font:12.5px var(--ui);padding:3px 9px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--paper)}
.ent{font:15.5px/1.6 var(--text);margin:0 0 8px}
.cmp{border-top:1px solid var(--line);padding:8px 0}
.cmp .fr,.cmp .en{font:14.5px/1.5 var(--text)}
.cmp .fr{color:var(--mut);margin-bottom:4px}
mark.tf{background:none;border-bottom:2px solid #c0762b;color:inherit;cursor:help}
mark.tf.s3{border-bottom-color:#b0412e;border-bottom-width:3px}
.tfl{font:12.5px/1.45 var(--ui);margin:4px 0 0;padding:4px 8px;background:var(--soft);border-radius:3px}
.tfl b{font-weight:600;color:#a0561c}
.enhd{color:var(--mut);font-size:12.5px}
::highlight(shl){background:#f3d36b;color:#1d211f}
.pref p{text-align:justify;margin:0 0 12px}
.msg{font:15px/1.5 var(--ui);color:var(--mut);padding:40px 0}
.msg a{display:block;margin:6px 0}
[hidden]{display:none!important}
@media (max-width:1100px){.app{grid-template-columns:var(--wr,230px) 6px minmax(0,1fr)}.gut[data-g=p]{display:none}.panel{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);z-index:10;box-shadow:-6px 0 20px rgba(0,0,0,.18);padding-top:calc(14px + env(safe-area-inset-top,0px))}.panel[data-open=false]{display:none}.only-narrow{display:inline-block}}
@media (max-width:760px){.gut{display:none}.only-phone{display:inline-block}.filt{display:flex;flex-wrap:wrap;gap:8px;flex-basis:100%}.filt[data-open=false]{display:none}.brand{font-size:17px}.bar input[type=search]{flex:1 1 140px}.app{grid-template-columns:minmax(0,1fr)}.rail{position:fixed;left:0;top:0;bottom:0;width:min(300px,88%);z-index:10;box-shadow:6px 0 20px rgba(0,0,0,.18);padding-top:calc(14px + env(safe-area-inset-top,0px))}.rail[data-open=false]{display:none}.read{padding-inline:16px}.tx{text-align:left}}
@media (prefers-reduced-motion:no-preference){.sec.flash .tx{animation:fl 1.2s ease-out}@keyframes fl{from{background:var(--accent-soft)}to{background:transparent}}}
</style>
</head><body>

<div class="app" id="app">
  <div class="bar">
    <a class="brand" id="brand" href="../" style="color:inherit;text-decoration:none">Natural Law Editions</a>
    <button class="btn only-narrow" id="railBtn" aria-controls="rail">Contents</button>
    <input type="search" id="q" placeholder="Search" aria-label="Search the text or go to a section">
    <button class="btn only-phone" id="filtBtn" aria-controls="filt">Filters</button>
    <div class="filt" id="filt" data-open="false">
    <label class="tg" id="lSrc"><input type="checkbox" id="tSrc" checked> Sources</label>
    <label class="tg" id="lPos"><input type="checkbox" id="tPos"> Possible matches <span style="text-decoration:underline dashed;text-underline-offset:3px">dashed</span></label>
    <label class="tg" id="l73"><input type="checkbox" id="t73"> <span></span></label>
    <label class="tg" id="lDiv"><input type="checkbox" id="tDiv" checked> <span></span></label>
    <div class="chips" id="fams" aria-label="Source filter"></div>
    </div>
    <button class="btn only-narrow" id="panelBtn" aria-controls="panel">Panel</button>
  </div>
  <nav class="rail" id="rail" data-open="false" aria-label="Contents"></nav>
  <div class="gut" data-g="r" role="separator" aria-label="Resize contents"></div>
  <main class="read" id="read"><div class="page" id="page"></div></main>
  <div class="gut" data-g="p" role="separator" aria-label="Resize panel"></div>
  <aside class="panel" id="panel" data-open="false" aria-live="polite"></aside>
</div>
<button class="enpop" id="enPop" hidden>English</button>
<script src="compose.js"></script>
<script>
// Shared viewer. Reads catalogue.json, then the edition named by ?ed=: its text, layers and reuse tables.
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fill=(t,o)=>String(t??'').replace(/\{(\w+)\}/g,(m,k)=>o[k]??'');
let ED='',M=null,V={},DIVS={},LAY={},TITLES={},FAMS=[],FAMI={},FN={},st={};
const SEC=[],ROWS=[],byId={},rowsBySec={},CH=[],chOf={};
function save(){try{localStorage.setItem('nle:'+ED,JSON.stringify({src:st.src,pos:st.pos,v73:st.v73,div:st.div,widths:st.widths,fams:st.fams,chap:st.chap,sel:st.sel}))}catch(e){}}
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(u+' ('+r.status+')');return r.json()}
function fail(h){$('page').innerHTML=`<div class="msg">${h}</div>`}
async function load(){
 fail('Loading…');
 const cat=await getJSON('../catalogue.json');
 ED=new URLSearchParams(location.search).get('ed')||(cat.editions.length===1?cat.editions[0].id:'');
 const E=cat.editions.find(e=>e.id===ED);
 if(!E){fail('Choose an edition:'+cat.editions.map(e=>`<a href="?ed=${encodeURIComponent(e.id)}">${esc(e.author)}, ${esc(e.short||e.title)}</a>`).join(''));return false}
 const base='../'+E.path;
 M=await getJSON(base+'edition.json');V=M.viewer||{};
 const tables=(cat.reuse||[]).filter(t=>t.from===ED);
 const got=await Promise.all([getJSON(base+M.text),...M.layers.map(l=>getJSON(base+l.file)),...tables.map(t=>getJSON('../'+t.path))]);
 build(got[0],got.slice(1,1+M.layers.length),got.slice(1+M.layers.length));return true}
const pageLink=p=>{const vol=(V.volumes||{})[p.vol]||{};return V.pageLink?fill(V.pageLink.url,Object.assign({},vol,p)):''};
function build(T,layers,tables){
 TITLES=T.titles||{};DIVS=Object.fromEntries(M.divisions.map(d=>[d.key,d]));
 const fams=(M.reuse&&M.reuse.families)||[];FAMS=fams.map(f=>[f.key,f.label]);FAMI=Object.fromEntries(fams.map(f=>[f.key,f]));FN=Object.fromEntries(FAMS);
 const marks={},extra={};
 const mk=(u,kind,p)=>{const m=marks[u]=marks[u]||{reuse:{},vars:{},old:{}};return m[kind][p]=m[kind][p]||(kind==='old'?{}:[])};
 const ex=u=>extra[u]=extra[u]||{vars:[],div:[],added:new Set()};
 tables.forEach(tb=>tb.rows.forEach(r=>{const o={id:r.id,sec:r.unit,fam:r.family,work:r.work,locus:r.locus,page:r.page,note:r.inNote,label:r.label,conf:r.confidence,status:r.status,vp:r.passage,sp:r.source,reason:r.reason,links:r.links||[],where:r.at.length?r.at[0][0]:'',step:r.step};
  if(r.french)o.fr=r.french;if(r.earliest)o.ew=r.earliest;ROWS[r.id]=o;(rowsBySec[r.unit]=rowsBySec[r.unit]||[]).push(o);
  r.at.forEach(([p,a,b])=>mk(r.unit,'reuse',p).push([a,b,r.id]))}));
 const EN={};
 M.layers.forEach((l,k)=>{const L=layers[k];LAY[l.kind]=l;
  if(l.kind==='variants')L.items.forEach(v=>{const e=ex(v.unit);
   e.vars.push({id:v.id,type:v.type,content:v.content,p1773:v.passage,p1758:v.otherPassage,pages1758:v.otherPages,link1758:v.otherLink,placed:v.placed});
   (v.at||[]).forEach(([p,a,b])=>mk(v.unit,'vars',p).push([a,b,v.id]));(v.wholeNotes||[]).forEach(n=>e.added.add(n));
   (v.otherReadings||[]).forEach(([p,pos,txt])=>{const o=mk(v.unit,'old',p);(o[pos]=o[pos]||[]).push(`<span class="d58" data-v="${v.id}" title="${Compose.esc(l.otherTitle)}">${Compose.esc(txt)}</span>`)})});
  if(l.kind==='comments')L.items.forEach(d=>ex(d.unit).div.push({w:d.locus,wid:d.sourceId,rel:d.relation,sev:d.severity,c:d.comment,lat:d.sourcePassage,vp:d.passage,conf:d.confidence,q:d.question,link:d.links||[]}));
  if(l.kind==='translation')Object.assign(EN,L.units)});
 const order={},cited={};T.units.forEach((u,i)=>order[u.id]=i);
 T.units.forEach(u=>[...(u.xr||[]),...(u.notes||[]).flatMap(n=>n.xr||[])].forEach(x=>(cited[x[2]]=cited[x[2]]||new Set()).add(u.id)));
 const famOf=id=>ROWS[id].fam;
 T.units.forEach((u,i)=>{const e=extra[u.id]||{vars:[],div:[],added:new Set()};const c=Compose.composeUnit(u,marks[u.id]||{},famOf);
  const s={id:u.id,i,book:u.div,chap:u.chap,para:u.n,margin:u.margin||'',kind:u.kind,unnum:!!u.unnumbered,html:c.html,
   notes:c.notes.map((n,k)=>({mark:n.mark,html:n.html,added:e.added.has(k)})),pages:(u.pages||[]).map(p=>Object.assign({},p,{z:pageLink(p)})),
   vars:e.vars,citedBy:[...(cited[u.id]||[])].sort((a,b)=>order[a]-order[b])};
  if(e.div.length)s.div=e.div;
  const en=EN[u.id];if(en){s.en={s:en.sents,g:en.align,p:en.page,f:en.flags||[]};s.fs=en.fr}
  SEC.push(s);byId[s.id]=s});
 SEC.forEach(s=>{if(s.kind==='heading')return;const d=DIVS[s.book]||{};const k=d.chapters?s.book+'.'+s.chap:s.chap;let c=CH[CH.length-1];if(!c||c.key!==k){c={key:k,book:s.book,chap:s.chap,secs:[]};CH.push(c)}c.secs.push(s);chOf[s.id]=c});

$('fams').innerHTML=FAMS.map(([k,n])=>`<button class="chip" data-f="${k}" aria-pressed="${st.fams[k]}" style="--c:var(--f${k})" title="${esc(n)}"><i></i>${esc(FAMI[k].chip||n)}</button>`).join('');
$('fams').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;st.fams[b.dataset.f]=!st.fams[b.dataset.f];b.setAttribute('aria-pressed',st.fams[b.dataset.f]);save();applyFilters();if(st.sel)select(st.sel)};
$('filtBtn').onclick=()=>{$('filt').dataset.open=$('filt').dataset.open==='true'?'false':'true'};
$('railBtn').onclick=()=>{$('rail').dataset.open=$('rail').dataset.open==='true'?'false':'true'};
$('panelBtn').onclick=()=>{$('panel').dataset.open=$('panel').dataset.open==='true'?'false':'true'};
addEventListener('hashchange',()=>{const h=decodeURIComponent(location.hash.slice(1));if(h)go(h)});
applyW();rail();
const h0=decodeURIComponent(location.hash.slice(1));
if(h0&&(byId[h0]||CH.some(c=>c.key===h0)))go(h0);else if(st.sel&&byId[st.sel])go(st.sel);else go(V.start||CH[0].secs[0].id);
if(innerWidth>1100){$('panel').dataset.open='true'}}
// resizable frames
function applyW(){const a=$('app');if(st.widths){if(st.widths.r)a.style.setProperty('--wr',st.widths.r+'px');if(st.widths.p)a.style.setProperty('--wp',st.widths.p+'px')}}
document.querySelectorAll('.gut').forEach(g=>g.addEventListener('pointerdown',e=>{e.preventDefault();g.setPointerCapture(e.pointerId);g.classList.add('drag');document.body.classList.add('resizing');
 const side=g.dataset.g;const mv=ev=>{st.widths=st.widths||{};if(side==='r')st.widths.r=Math.max(150,Math.min(520,ev.clientX));else st.widths.p=Math.max(260,Math.min(innerWidth*0.6,innerWidth-ev.clientX));applyW()};
 const up=()=>{g.classList.remove('drag');document.body.classList.remove('resizing');g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);save()};
 g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up)}));
document.querySelectorAll('.gut').forEach(g=>g.addEventListener('dblclick',()=>{st.widths={};$('app').style.removeProperty('--wr');$('app').style.removeProperty('--wp');save()}));
load().then(ok=>{if(ok)init()}).catch(e=>fail(`Could not load the edition: ${esc(e.message)}`));
