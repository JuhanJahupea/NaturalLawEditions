<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Natural Law Editions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+French+Canon+SC&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f5f6f3;--paper:#fbfbf9;--fg:#1d211f;--mut:#5e6662;--line:#d9ddd6;--accent:#27507c;
  --display:"IM Fell French Canon SC",Georgia,serif;--text:"Source Serif 4",Georgia,serif;--ui:"IBM Plex Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121514;--paper:#181c1a;--fg:#e2e5e1;--mut:#9aa39e;--line:#2c322f;--accent:#8fb3dc;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121514;--paper:#181c1a;--fg:#e2e5e1;--mut:#9aa39e;--line:#2c322f;--accent:#8fb3dc;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--text)}
main{max-width:760px;margin:0 auto;padding:40px 16px 80px}
h1{font:34px/1.2 var(--display);margin:0 0 6px}
h2{font:13px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:36px 0 8px}
.lead{color:var(--mut);margin:0 0 24px}
a{color:var(--accent)}
.ed{display:block;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px;text-decoration:none;color:var(--fg);margin-bottom:10px}
.ed:hover{border-color:var(--accent)}
.ed b{display:block;font:22px/1.3 var(--display)}
.ed span{font:13.5px var(--ui);color:var(--mut)}
table{width:100%;border-collapse:collapse;font:13.5px/1.45 var(--ui)}
td,th{text-align:left;padding:5px 8px 5px 0;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500}
td.n{text-align:right;font-variant-numeric:tabular-nums;padding-right:0}
tr.grp th{color:var(--fg);font-weight:600;padding-top:18px;border-top:0}
.foot{margin-top:36px;font:13px var(--ui);color:var(--mut)}
</style>
</head><body>
<main>
  <h1 id="title">Natural Law Editions</h1>
  <p class="lead" id="desc"></p>
  <h2>Editions</h2>
  <div id="eds"></div>
  <h2>Reuse tables</h2>
  <table><thead><tr><th>Source text</th><th>Text layer compared</th><th style="text-align:right">Rows</th></tr></thead><tbody id="reuse"></tbody></table>
  <p class="foot">Format: <a href="docs/FORMAT.md">docs/FORMAT.md</a>. Data: <a href="catalogue.json">catalogue.json</a>.</p>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('catalogue.json').then(r=>r.json()).then(c=>{
  document.getElementById('desc').textContent=c.description||'';
  document.getElementById('eds').innerHTML=c.editions.map(e=>`<a class="ed" href="viewer/?ed=${encodeURIComponent(e.id)}"><b>${esc(e.author)}, ${esc(e.short||e.title)}</b><span>${esc(e.imprint)} · ${esc(e.status)}</span></a>`).join('');
  const T=Object.fromEntries((c.texts||[]).map(t=>[t.id,t]));c.editions.forEach(e=>T[e.id]=Object.assign({edition:true},e));
  const rows=c.editions.flatMap(e=>{const tb=(c.reuse||[]).filter(r=>r.from===e.id);if(!tb.length)return [];
   return [`<tr class="grp"><th colspan="3">${esc(e.author)}, <i>${esc(e.title)}</i> (${esc(e.date)}): ${tb.reduce((a,r)=>a+r.rows,0)} rows in ${tb.length} tables</th></tr>`]
    .concat(tb.map(r=>{const t=T[r.to]||{};const name=`${esc(t.author||r.to)}, <i>${esc(t.title||'')}</i>${t.date?` (${esc(t.date)})`:''}`;
     return `<tr><td>${t.edition?`<a href="viewer/?ed=${encodeURIComponent(r.to)}">${name}</a> · edition`:name}</td><td>${esc(t.layer||'')}</td><td class="n">${r.rows}</td></tr>`}))});
  document.getElementById('reuse').innerHTML=rows.join('')||'<tr><td colspan="3">None yet.</td></tr>';
}).catch(()=>{document.getElementById('eds').textContent='Could not read catalogue.json.'});
</script>
</body></html>
